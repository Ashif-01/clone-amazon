<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">AmazonClone</div>
        <div class="search-bar">
            <input type="text" placeholder="Search products...">
            <button>Search</button>
        </div>
        <div class="cart">🛒 Cart: <span id="cart-count">0</span></div>
    </header>

    <main class="product-grid">
        
        <div class="product-card">
            <img src="https://via.placeholder.com/150/0000FF/808080?Text=Digital.com" alt="Laptop">
            <h3 class="product-title">High-Performance Laptop</h3>
            <p class="price">₹85,000</p>
            <button class="add-to-cart" onclick="addToCart()">Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/150/FF0000/FFFFFF?Text=Digital.com" alt="Headphones">
            <h3 class="product-title">Noise Cancelling Headphones</h3>
            <p class="price">₹12,500</p>
            <button class="add-to-cart" onclick="addToCart()">Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/150/00FF00/000000?Text=Digital.com" alt="Smartwatch">
            <h3 class="product-title">Fitness Smartwatch</h3>
            <p class="price">₹4,999</p>
            <button class="add-to-cart" onclick="addToCart()">Add to Cart</button>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
